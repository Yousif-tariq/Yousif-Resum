version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quantum_portfolio_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - backend_media:/app/media
      - backend_db:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/portfolio-data/')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quantum_portfolio_frontend
    restart: always
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - backend_media:/usr/share/nginx/html/media:ro

volumes:
  backend_media:
  backend_db:
